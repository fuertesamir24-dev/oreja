<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <title>Huye del Asesino</title>
   <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
   <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
   </style>
</head>
<body>

<script>
class NivelPersecucion extends Phaser.Scene {
    constructor () {
        super ('NivelPersecucion');
    }

    preload (){
        this.load.image('player', 'https://raw.githubusercontent.com/MathewXv/Im-genes-busca-tu-oreja/main/Larry.png');
        this.load.image('killer', 'https://raw.githubusercontent.com/MathewXv/Im-genes-busca-tu-oreja/main/ElMochaorejas.png');
        this.load.image('wall', 'https://raw.githubusercontent.com/MathewXv/Im-genes-busca-tu-oreja/main/Cotonete%20Parcell.png');
        this.load.image('itemEspecial', 'https://raw.githubusercontent.com/MathewXv/Im-genes-busca-tu-oreja/main/Oreja%20Larry.png');    
    }

    create (){
        this.paredes = this.physics.add.staticGroup();
        
        this.crearPared(200, 150, 200, 32);
        this.crearPared(600, 150, 200, 32);
        this.crearPared(400, 300, 150, 32);
        this.crearPared(200, 450, 200, 32);
        this.crearPared(600, 450, 200, 32);
        this.crearPared(400, 100, 32, 120);
        this.crearPared(400, 500, 32, 120);

        this.player = this.physics.add.sprite(400, 200, 'player');
        this.player.body.setCollideWorldBounds(true);
    
        this.killer = this.physics.add.sprite(100, 100, 'killer');
        this.killer.setCollideWorldBounds(true);

        this.item = this.physics.add.sprite(400, 360, 'itemEspecial');

        this.physics.add.collider(this.player, this.paredes);
        this.physics.add.collider(this.killer, this.paredes);

        this.physics.add.overlap(this.player, this.killer, this.atrapado, null, this);
        this.physics.add.overlap(this.player, this.item, this.recogerItem, null, this);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });
    }

    crearPared(x, y, ancho, alto) {
        let pared = this.paredes.create(x, y, 'wall');
        pared.setDisplaySize(ancho, alto);
        pared.refreshBody();
    }  

    update (){
        this.player.setVelocity(0);

        if (this.cursors.left.isDown || this.wasd.left.isDown) {
            this.player.setVelocityX(-200);
        } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
            this.player.setVelocityX(200);
        }

        if (this.cursors.up.isDown || this.wasd.up.isDown) {
            this.player.setVelocityY(-200);
        } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
            this.player.setVelocityY(200);
        }

        this.physics.moveToObject(this.killer, this.player, 110);

        if (this.player.x < 0) {
            this.player.x = 800;
        } else if (this.player.x > 800) {
            this.player.x = 0;   
        }
    }

    atrapado (player, killer) {
        alert("¡Te Cortó la Oreja! Pantalla en negro...");
        this.scene.restart();
    }

    recogerItem (player, item) {
        item.disableBody(true, true);
        console.log("¡Tomaste el ítem especial!");
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: NivelPersecucion
};

const game = new Phaser.Game(config);
</script>  

</body>
</html>
